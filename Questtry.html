<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окей • Квест</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nosifer&display=swap');
        body { margin:0; padding:0; color:#fff; text-align:center; font-family:'Nosifer',cursive; background-image:url('https://github.com/f22raf/my-music-site/raw/main/1746449062889.jpg'); background-size:cover; background-position:center; min-height:100vh; font-size:1.2em; text-shadow:1px 1px 0 #000,2px 2px 0 #333; }
        .container { max-width:720px; margin:20px auto; padding:25px; background:rgba(0,0,0,0.65); border:3px solid #ff0000; }
        .group-name { font-size:2.4em; color:#ff004f; margin:10px 0; text-shadow:2px 2px 0 #000,4px 4px 0 #ff2200; }
        h2 { color:#ffcc00; margin:22px 0 14px; font-size:1.9em; letter-spacing:1px; }
        .question { color:#fff; margin:15px 0; font-size:1.1em; line-height:1.4; }
        input { background:#111; border:2px solid #ff004f; color:#fff; padding:12px; width:80%; margin:10px auto; font-family:'Nosifer',cursive; font-size:1.1em; text-align:center; display:block; border-radius:0; box-shadow:0 3px 0 #000; }
        input:focus { outline:none; border-color:#ffcc00; }
        .btn { display:inline-block; padding:10px 20px; margin:10px; color:white; text-decoration:none; border:2px solid #ff0000; background:#ff004f; font-family:'Nosifer',cursive; font-size:1.3em; min-width:140px; transition:transform 0.1s; cursor: pointer; }
        .btn:hover { transform:translateX(3px) translateY(3px); box-shadow:3px 3px 0 #000; }
        .card { border:4px double #ffcc00; padding:20px; background:rgba(139,0,0,0.3); margin:25px 0; box-shadow:0 0 15px #ffcc00,0 4px 0 #000; animation:glow 1s infinite alternate; }
        @keyframes glow { from { box-shadow:0 0 10px #ffcc00,0 4px 0 #000; } to { box-shadow:0 0 25px #ffcc00,0 4px 0 #000; } }
        .card-img { width:100%; max-width:280px; border:3px solid #ff004f; margin:0 auto 15px; display:block; box-shadow:0 4px 0 #000; }
        .card-text { color:#ffcc00; margin:5px 0; font-size:1.2em; text-shadow:2px 2px 0 #000; }
        .marker { color:#ffcc00; font-size:0.9em; margin-top:10px; padding:8px; background:rgba(0,0,0,0.5); border:1px dashed #ff004f; display:inline-block; font-family:monospace; }
        .warn { background:rgba(139,0,0,0.3); border-left:4px solid #ff004f; padding:15px; margin:25px 0; font-size:0.9em; color:#fff; text-align:left; }
        .admin-table { width:100%; border-collapse:collapse; margin:20px 0; font-size:0.8em; }
        .admin-table th, .admin-table td { border:1px solid #ff004f; padding:8px; text-align:center; }
        .admin-table th { background:#ff004f; color:#fff; }
        .admin-table tr:nth-child(even) { background:rgba(255,0,79,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="group-name">Окей</div>
        <h2>🎸 КВЕСТ ДЛЯ ФАНБАЗЫ 🎸</h2>
        
        <div id="content">
            <p class="question">Дата основания группы:</p>
            <input type="password" id="pass" placeholder="ДДММГГГГ" maxlength="8">
            <br>
            <a href="#" class="btn" onclick="go()">ВВОД</a>

            <p class="question" style="margin-top:30px; font-size:0.9em; color:#888;">🔐 Вход для админа:</p>
            <input type="password" id="adminPass" placeholder="Пароль админа" maxlength="20">
            <br>
            <a href="#" class="btn" style="background:#444; border-color:#666; font-size:1em; padding:8px 15px;" onclick="adminGo()">АДМИН</a>
        </div>
    </div>

    <script>
        let isTestMode = false;
        let currentQuestions = [];
        
        // 🃏 12 карт (УБРАНЫ: 2/5, 4/5, 8/5, 9/5, 1/6, 2/6, 10/5, 7/6)
        const cards = [
            {img:"InShot_20260908_193350301.jpg", номер:1, экз:5, marker:"OK5-1A7K-M2P9"},
            {img:"InShot_20260908_194843167.jpg", номер:3, экз:5, marker:"OK5-3C9M-P4R1"},
            {img:"InShot_20260908_195813432.jpg", номер:6, экз:5, marker:"OK5-6F2P-S7U4"},
            {img:"InShot_20260908_200144557.jpg", номер:7, экз:5, marker:"OK5-7G3Q-T8V5"},
            {img:"InShot_20260908_194843167.jpg", номер:3, экз:6, marker:"OK6-3M9W-Z4B1"},
            {img:"InShot_20260909_180855828.jpg", номер:5, экз:6, marker:"OK6-5O1Y-B6D3"},
            {img:"InShot_20260908_201503065.jpg", номер:9, экз:6, marker:"OK6-9S5C-F0H7"},
            {img:"InShot_20260908_204204488.jpg", номер:10, экз:6, marker:"OK6-0T6D-G1I8"}
        ];

        const questionBank = [
            { q: "Кто в группе играет на бас-гитаре?", a: ["томас"] },
            { q: "Где прошёл Окей Ивент Гаражник 29.08.2026?", a: ["Jack Jack", "Джек Джек", "Культуры 69"] },
            { q: "Какая фамилия у Ротгара?", a: ["михайлов"] },
            { q: "Кто написал песню 'Юрский Движ'?", a: ["ковбой раф евро", "раф евро", "ковбой раф"] },
            { q: "Какая акустическая гитара была у Белого Джинна в Окей?", a: ["colombo", "колумбо", "коломбо"] },
            { q: "Кем был Птеро до Окей?", a: ["ковидный"] },
            { q: "В каком году Томас пришёл в Окей?", a: ["2025"] },
            { q: "На каком инструменте изначально игралось соло в 'Изумрудный Город'?", a: ["флейта"] },
            { q: "Как называется путь от Временного Рейнджера Стража до Окейтозавра?", a: ["калифорнийская тропа"] },
            { q: "Сколько рук у Ковбоя Рафа Евро?", a: ["2", "две", "всего две руки"] },
            { q: "Какая электроакустическая гитара была у Клауса в Окей?", a: ["martinez", "мартинез"] },
            { q: "Артефакт Архивариуса(#1-#6)?", a: ["Окей: Хроники Супер Панка!", "мини книга", "хроники супер панка"] },
            { q: "На каком выступлении дебютировал Снайпер?", a: ["11", "#11", "номер 11", "Озеров Фест", "Ozerov Fest"] },
        ];

        function getRandomQuestions() {
            return [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 3);
        }

        function normalize(str) {
            return str.trim().toLowerCase().replace(/ё/g, 'е');
        }

        function checkAnswer(user, correct) {
            const norm = normalize(user);
            return correct.some(a => norm.includes(normalize(a)));
        }

        // Блокировка 24 часа
        window.addEventListener('load', () => {
            const lastTime = localStorage.getItem('quest_time_v4');            
            if (lastTime) {
                const hoursPassed = (Date.now() - parseInt(lastTime)) / 3600000;
                if (hoursPassed < 24) {
                    document.getElementById('content').innerHTML = `
                        <div class="warn" style="text-align:center; padding:30px; border:3px solid #ff004f;">
                            <h2 style="color:#ff004f; margin-bottom:15px;">⏳ ТЫ УЖЕ ПРОХОДИЛ КВЕСТ!</h2>
                            <p style="font-size:1.1em; margin:15px 0;">
                                Следующая попытка через:<br>
                                <strong style="color:#ffcc00; font-size:1.4em;">${Math.ceil(24 - hoursPassed)} ч.</strong>
                            </p>
                            <p style="color:#888; font-size:0.85em; margin-top:20px;">
                                Последняя попытка:<br>
                                ${new Date(parseInt(lastTime)).toLocaleString('ru-RU')}
                            </p>
                            <a href="index.html" class="btn" style="margin-top:25px; border-color:#4c75a8; background:#4c75a8;">← НА ГЛАВНУЮ</a>
                        </div>
                    `;
                    return;
                }
            }
            localStorage.removeItem('quest_claiming_v4');
        });

        function go() {
            const p = document.getElementById('pass').value;
            if (p === '00000000') {
                isTestMode = true;
                startQuiz();
            } else if (p === '26082022') {
                const last = localStorage.getItem('quest_time_v4');
                if (last && Date.now() - last < 86400000) {
                    alert(' Уже проходил квест! Следующая попытка завтра.');
                    return;
                }
                isTestMode = false;
                startQuiz();
            } else {
                alert('❌ Птеро уже вылетел за тобой!');
            }
        }

        function adminGo() {
            const p = document.getElementById('adminPass').value;
            if (p === 'admin2026') {
                showAdminPanel();
            } else {
                alert('❌ Неверный пароль админа!');
            }
        }

        function startQuiz() {
            currentQuestions = getRandomQuestions();
            let html = currentQuestions.map((q, i) => 
                `<p class="question">${i+1}. ${q.q}</p><input type="text" id="a${i+1}" placeholder="...">`
            ).join('');
            html += `<br><a href="#" class="btn" onclick="check()">ОТВЕТИТЬ</a>`;
            document.getElementById('content').innerHTML = html;
        }

        function check() {
            if (localStorage.getItem('quest_claiming_v4') === 'true') {
                alert('⏳ Карта уже выдаётся!');
                return;
            }
            
            const answers = [1,2,3].map(i => document.getElementById(`a${i}`).value);
            if (!currentQuestions.every((q, i) => checkAnswer(answers[i], q.a))) {
                alert(' Ошибка в ответах! Иди учи лор на главной.');
                location.reload();
                return;
            }

            localStorage.setItem('quest_claiming_v4', 'true');
            
            // 🔥 ИСПРАВЛЕНИЕ: Используем МАРКЕРЫ вместо индексов!
            let usedMarkers = isTestMode ? [] : JSON.parse(localStorage.getItem('quest_used_markers_v4') || '[]');
            
            // Фильтруем по маркеру (не по индексу!)
            const available = cards.filter(c => !usedMarkers.includes(c.marker));
            
            if (!isTestMode && available.length === 0) {
                localStorage.removeItem('quest_claiming_v4');
                alert('🎉 Все карты разыграны!');
                location.href = 'index.html';
                return;
            }

            const randIdx = Math.floor(Math.random() * available.length);
            const card = available[randIdx];
            
            if (!isTestMode) {
                usedMarkers.push(card.marker); // Сохраняем МАРКЕР
                localStorage.setItem('quest_used_markers_v4', JSON.stringify(usedMarkers));
                localStorage.setItem('quest_time_v4', Date.now().toString());
                localStorage.setItem('quest_last_marker_v4', card.marker);
            }

            localStorage.removeItem('quest_claiming_v4');
            show(card);
        }
        
        function show(card) {
            const shareText = `🎉 Я выбил карту в викторине!\n\n🃏 Карта №${card.номер}/10\n🔢 Экземпляр №${card.экз}/6\n\n Маркер: ${card.marker}\n\n СЕЙЧАС СДЕЛАЮ СКРИНШОТ И ПРИКРЕПЛЮ ЕГО!\n\nПроверьте и выдайте физическую карту!`;
            const encodedText = encodeURIComponent(shareText);
            const siteUrl = encodeURIComponent('https://f22raf.github.io/my-music-site/');
            
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <img src="${card.img}" class="card-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%27280%27 height=%27380%27><rect width=%27280%27 height=%27380%27 fill=%27%23222%27/><text x=%2750%27 y=%27200%27 fill=%27%23ff004f%27 font-size=%2724%27>КАРТА</text></svg>'">
                    <div class="card-text">🎸 Коллекционная карточка Окей!</div>
                    <div class="card-text" style="color:#ff004f; font-size:1.1em;">${card.номер}/10, Экз. ${card.экз}/6</div>
                    <div class="marker">🎯 ${card.marker}</div>
                </div>
                <div class="warn" style="text-align:center; border:3px solid #ffcc00; background:rgba(255,204,0,0.1);">
                    <strong style="color:#ffcc00; font-size:1.2em;">⚡ ВАЖНО!</strong><br>
                    Нажми кнопку ниже, чтобы отправить результат в Фан Базу.<br>
                    <span style="color:#ff004f;">Сделай скриншот этой страницы и прикрепи к сообщению!</span>
                </div>
                <a href="https://t.me/share/url?url=${siteUrl}&text=${encodedText}" target="_blank" class="btn" style="background:#0088cc; border-color:#0088cc; font-size:1.4em; padding:15px 30px; margin:20px 0;">
                    📤 ОТПРАВИТЬ ДЛЯ ПОЛУЧЕНИЯ
                </a>
                <div style="color:#888; font-size:0.85em; margin:15px 0; padding:15px; background:rgba(0,0,0,0.3); border:1px solid #444;">
                    💡 Или сделай скриншот и напиши Ковбою Рафу<br>
                    <span style="color:#ff004f;">(Только Челябинск!)</span>
                </div>
                <a href="index.html" class="btn" style="border-color:#4c75a8;background:#4c75a8; margin-top:10px;">← НА ГЛАВНУЮ</a>
            `;
        }

        function showAdminPanel() {
            const usedMarkers = JSON.parse(localStorage.getItem('quest_used_markers_v4') || '[]');
            const lastMarker = localStorage.getItem('quest_last_marker_v4');
            const lastTime = localStorage.getItem('quest_time_v4');
            
            let html = `<h2>🔐 АДМИН-ПАНЕЛЬ</h2>`;
            
            // Находим последнюю карту по маркеру
            const lastCard = lastMarker ? cards.find(c => c.marker === lastMarker) : null;
            html += `<p style="color:#ffcc00;">Последняя выпавшая карта: ${lastCard ? `№${lastCard.номер}, Экз.${lastCard.экз}, Маркер: ${lastCard.marker}` : 'Нет'}</p>`;
            html += `<p style="color:#888;">Время: ${lastTime ? new Date(parseInt(lastTime)).toLocaleString('ru-RU') : 'Нет'}</p>`;
            html += `<p style="color:#ff004f;">Осталось карт в розыгрыше: ${cards.length - usedMarkers.length} из ${cards.length}</p>`;
            
            html += `<h3 style="color:#ffcc00; margin-top:30px;">📋 ВСЕ КАРТЫ И МАРКЕРЫ:</h3>`;
            html += `<table class="admin-table">
                <tr><th>№ Карты</th><th>Экз.</th><th>Маркер</th><th>Статус</th></tr>`;
            
            cards.forEach(card => {
                const isUsed = usedMarkers.includes(card.marker); // Проверяем по МАРКЕРУ
                let status = isUsed ? '✅ Выдана' : '🎲 В розыгрыше';
                
                html += `<tr>
                    <td>${card.номер}</td>
                    <td>${card.экз}</td>
                    <td style="font-family:monospace; color:#ffcc00;">${card.marker}</td>
                    <td>${status}</td>
                </tr>`;
            });
            
            html += `</table>`;
            html += `<a href="index.html" class="btn" style="border-color:#4c75a8;background:#4c75a8;">← НА ГЛАВНУЮ</a>`;
            
            document.getElementById('content').innerHTML = html;
        }
    </script>
</body>
</html>
